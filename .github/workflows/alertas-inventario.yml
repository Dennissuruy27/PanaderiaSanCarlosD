
name: Alertas automaticas de inventario

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

concurrency:
  group: revision-inventario
  cancel-in-progress: false

jobs:
  revisar-inventario:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar existencias y enviar alertas
        env:
          CLAVE: ${{ secrets.CRON_NOTIFICACIONES_CLAVE }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "Falta configurar el secreto."
            exit 1
          fi

          curl --fail-with-body \
            --show-error \
            --silent \
            --retry 2 \
            --max-time 240 \
            --request POST \
            --header "X-Cron-Secret: ${CLAVE}" \
            "https://panaderiasancarlosd.onrender.com/PROYECTOWEB/api/notificaciones/ejecutar"
